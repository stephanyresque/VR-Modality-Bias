run:
  name: "composed_internvl3_odibench"
  seed_global: 42
  output_root: "results/runs"

dataset:
  name: "odibench"
  manifest_path: "data/processed/odibench/manifest.jsonl"
  images_dir: "data/processed/odibench/images"
  n_images: 200

model:
  key: "internvl3-8b-hf"
  model_id: "OpenGVLab/InternVL3-8B-hf"
  dtype: "bfloat16"

task:
  name: "vqa_composed"
  prompt_key: "vqa_composed"

generation:
  max_new_tokens: 256
  do_sample: false
  temperature: 1.0
  top_p: 1.0
  repetition_penalty: 1.2
